name: Capture validation
on:
  pull_request:
    paths:
      - 'extension/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'server/**'
      - 'netlify/**'
      - 'integrations/**'
      - 'package*.json'
      - '.github/workflows/capture-validation.yml'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test && npm run build
      - run: node scripts/verify-extension-package.mjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-smoke.cjs
      - run: node scripts/workspace-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-panel-preview
          path: /tmp/pathira-panel.png
  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pathira_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: pathira_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f test/sql/setup.sql -f db/releases-2-6.sql -f db/restrict-anonymous-grants.sql -f test/sql/access.sql
