name: Capture validation
on:
  pull_request:
    paths:
      - 'extension/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - '.github/workflows/capture-validation.yml'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test && npm run build
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-panel-preview
          path: /tmp/pathira-panel.png
